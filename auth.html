<!--* CloudCrop - Authentication Page (auth.html)
 *
 * This file handles user authentication for the CloudCrop platform.
 * It provides login and signup functionality using Firebase Authentication
 * and redirects authenticated users to the main dashboard.
 *
 * Features:
 * - Firebase email/password authentication
 * - User login and registration
 * - Session persistence with auto-redirect
 * - Basic form validation (email/password input)
 * - Secure redirect to dashboard after login
 *
 * Security Notes:
 * - Firebase API key is public and safe for frontend use
 * - Authentication is fully handled by Firebase backend
 * - No sensitive credentials are stored locally
 *
 * Author: Sajal Das
 * Modified: 4/11/2026
 -->
 
<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudCrop Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#213726,#4a8a5a);
      display:flex; justify-content:center; align-items:center;
      height:100vh; margin:0;
    }
    .box {
      background:#fff;
      padding:40px;
      border-radius:12px;
      width:100%;
      max-width:450px;
      text-align:center;
    }
    input {
      width:100%; padding:10px; margin:8px 0;
      border:1px solid #ccc; border-radius:6px;
      box-sizing:border-box;
    }
    button {
      width:100%; padding:10px;
      background:#2d5a2d; color:white;
      border:none; border-radius:6px;
      cursor:pointer;
    }
    button:hover { background:#3e7a3e; }

    /* Eye toggle */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin: 8px 0;
    }
    .password-wrapper input {
      margin: 0;
      padding-right: 2.6rem;
    }
    .eye-toggle {
      position: absolute;
      right: 0.6rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: #888;
      transition: color 0.2s;
    }
    .eye-toggle:hover { color: #2d5a2d; }
    .eye-icon { width: 18px; height: 18px; }
  </style>
</head>

<body>

<div class="box">
  <h2>CloudCrop Login</h2>

  <input type="email" id="email" placeholder="Email">

  <div class="password-wrapper">
    <input type="password" id="password" placeholder="Password">
    <button type="button" class="eye-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
      <svg class="eye-icon eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-icon eye-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </div>

  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
</div>

<script>
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.querySelector('.eye-show').style.display = isHidden ? 'none' : '';
  btn.querySelector('.eye-hide').style.display = isHidden ? ''     : 'none';
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "cloudcorp-39ad1.firebaseapp.com",
  projectId: "cloudcorp-39ad1",
  storageBucket: "cloudcorp-39ad1.firebasestorage.app",
  messagingSenderId: "738798231646",
  appId: "1:738798231646:web:73ea36f328d9aea78cd4cf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// redirect if already logged in
onAuthStateChanged(auth, user => {
  if (user) window.location.href = "index.html";
});

// LOGIN
window.login = async function () {
  const email = document.getElementById("email").value;
  const pass  = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "index.html";
  } catch (e) {
    alert(e.message);
  }
};

// SIGNUP
window.signup = async function () {
  const email = document.getElementById("email").value;
  const pass  = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    window.location.href = "index.html";
  } catch (e) {
    alert(e.message);
  }
};
</script>

</body>
</html>
